[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-template"
version = "0.1.0"
description = "Production RAG template: hybrid search, reranking, caching, tracing and evaluation in CI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Sofya Babkina" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "qdrant-client>=1.12",
    "httpx>=0.27",
    "numpy>=1.26",
    "snowballstemmer>=2.2",
    "prometheus-client>=0.20",
    "redis>=5.0",
    "pypdf>=4.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ml = ["sentence-transformers>=3.0"]
eval = ["sentence-transformers>=3.0", "datasets>=2.19", "matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.5", "fakeredis>=2.23"]

[project.scripts]
rag = "rag_template.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_template"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["models: needs downloaded embedding and reranker models"]
addopts = "-m 'not models'"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "B905", "E501"]
