name: Answer evaluation

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Сколько вопросов (пусто — все)"
        required: false

jobs:
  answers:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.20.0
        ports: ["6333:6333"]
    env:
      RAG_QDRANT_URL: http://localhost:6333
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('src/rag_template/config.py') }}
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[ml]"
      - run: rag ingest data/demo/fastapi-ru --base-url https://fastapi.tiangolo.com/ru/
      - run: rag eval answers --out results/ci_answers.jsonl --summary results/ci_answers_summary.json ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: answers
          path: results/ci_answers*
